<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岛仔 · 无线设备动效选样</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e7e1;color:#292b28;font:14px "Segoe UI","Microsoft YaHei UI",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #229eb0;outline-offset:3px}
main{width:min(1160px,100%);margin:auto;padding:32px clamp(14px,3vw,42px) 36px}
header,.toolbar,.title,.numrow,.key,.dock,.devicebar,.digits,.picks,.legend{display:flex;align-items:center}.title{gap:10px}.title small{font:11px Consolas,monospace;color:#71746e}h1{font-size:clamp(20px,3vw,30px);letter-spacing:-1px;margin:0}header{justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #b7b8ae;padding-bottom:17px}.toolbar{gap:8px;font-size:12px}.toolbar select,.toolbar button{border:1px solid #b6b8ad;background:#f8f7f1;border-radius:6px;padding:6px 8px}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:21px 18px;margin-top:22px}article{min-width:0}.title{margin:0 2px 7px}.title h2{font-size:16px;font-weight:650;margin:0}.title span{font-size:11px;color:#5f645e;margin-left:auto}.stage{border-radius:16px;height:187px;position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;flex-direction:column}.icon{display:block;width:29px;height:29px;flex:none}.unit{border:0;background:none;padding:0;min-width:0}.row{display:flex;justify-content:center;align-items:center;width:94%;gap:4px}.unit{flex:1;text-align:center}.name{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:10px}.numrow{gap:5px;justify-content:center;font:600 13px Consolas,monospace;font-variant-numeric:tabular-nums}.mini{display:inline-block;width:18px;height:9px;position:relative;vertical-align:middle;border:1px solid currentColor;border-radius:2px;padding:1px;color:var(--ink);flex:none;margin-right:2px}.mini:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:3px;background:currentColor}.mini i{display:block;width:var(--level);height:100%;background:currentColor;transition:width .65s}.empty{border-style:dashed}.bolt{font-size:11px;color:var(--ink)}.numrow{color:var(--ink)}.caption{font-size:11px;margin:7px 2px 0;color:#5f645e}.stage button{color:inherit}.stage .unit[aria-pressed=true] .name{text-decoration:underline;text-underline-offset:3px}
.film{background:radial-gradient(ellipse at 50% 120%,#29404b,#0d191f 75%);color:#daecee}.film .row{border-top:1px solid #50626a;border-bottom:1px solid #50626a;padding:12px 0}.film .unit{position:relative;border-right:1px solid #354750}.film .unit:last-child{border:0}.film .icon{margin:2px auto 9px;width:36px;height:36px}.film .name{margin-top:5px}.film.play:after{content:"";position:absolute;inset:16% 0;pointer-events:none;background:linear-gradient(90deg,transparent,#94d5e529,#d3f8ff9c 98%,transparent);width:11%;animation:scan 1.1s ease-in-out both}@keyframes scan{from{left:-15%}to{left:106%}}
.paper{background:#c9c4af;color:#3e4033}.ticket{width:89%;background:#fffbe5;padding:12px 15px 17px;box-shadow:2px 4px 7px #47452d36;position:relative;transform:rotate(-1.2deg)}.ticket:after{content:"";position:absolute;top:100%;height:6px;left:0;right:0;background:linear-gradient(135deg,#fffbe5 25%,transparent 25%) 0 0/10px 10px,linear-gradient(225deg,#fffbe5 25%,transparent 25%) 0 0/10px 10px}.tickethead{display:flex;justify-content:space-between;font-size:10px;border-bottom:1px dashed #9c9b85;padding-bottom:6px}.paper .row{width:100%;margin-top:8px}.paper .icon{margin:0 auto 5px;width:21px;height:21px}.paper .numrow{margin-top:5px}.paper.play .ticket{animation:feed .68s steps(8,end)}@keyframes feed{from{transform:translateY(-15px) rotate(-1.2deg);clip-path:inset(0 0 60%)}to{transform:rotate(-1.2deg);clip-path:inset(0)}}
.shelf{background:linear-gradient(160deg,#d7dde4,#aab6c1);color:#253343}.shelf .row{width:89%;position:relative;gap:7px;align-items:flex-start}.shelf .row:before{content:"";position:absolute;left:-2%;right:-2%;top:46px;height:19px;background:linear-gradient(#e3e9e9,#8d9ba7 60%,#75838e);border-radius:50% 50% 7px 7px;box-shadow:0 10px 9px #4957644d}.shelf .unit{position:relative}.cap{width:47px;height:46px;margin:6px auto 13px;border-radius:13px;background:linear-gradient(145deg,#f5f8fa,#c6ced7);box-shadow:inset 1px 1px 1px white,2px 4px 2px #76838c,3px 7px 7px #43515d55;display:grid;place-items:center}.shelf .unit[aria-pressed=true] .cap{outline:2px solid #788d9c;outline-offset:2px}.shelf .numrow{margin-top:4px}.shelf.play .unit[aria-pressed=true] .cap{animation:dock .65s both}@keyframes dock{0%{transform:translateY(-12px) rotate(-7deg)}55%{transform:translateY(2px)}78%{transform:translateY(-2px)}}
.flip{background:#22221f;color:#f5ede1}.flipbody{width:88%;display:flex;align-items:center;justify-content:space-between}.digits{gap:3px}.digit{display:grid;place-items:center;position:relative;width:44px;height:59px;border:1px solid #4e4d47;border-radius:5px;background:linear-gradient(#42413b 49%,#272823 50%);font:600 46px/1 Consolas,monospace;box-shadow:0 3px 0 #121310}.digit:after{content:"";position:absolute;top:50%;width:100%;height:2px;background:#141411}.digits small{align-self:flex-end;font:15px Consolas;margin:0 3px 6px}.selected{display:flex;align-items:center;gap:10px}.selected .icon{width:33px;height:33px}.selected strong,.selected small{display:block}.selected small{font-size:10px;color:var(--ink);margin-top:4px}.picks{justify-content:center;gap:10px;margin-top:12px}.pick{display:grid;place-items:center;width:35px;height:26px;background:transparent;border:0;border-radius:5px;opacity:.56}.pick[aria-pressed=true]{opacity:1;background:#ffffff24}.pick .icon{width:17px;height:17px}.flip.play .digit{transform-origin:50% 50%;animation:flip .48s ease-out}.flip.play .digit:nth-child(2){animation-delay:.06s}@keyframes flip{0%{transform:perspective(150px) rotateX(-78deg);opacity:.4}to{transform:rotateX(0)}}
.echo{background:#10292a;color:#bfe4d6}.echo .sonar{width:126px;height:126px;border-radius:50%;background:repeating-radial-gradient(transparent 0 17px,#517e703f 18px 19px);display:grid;place-items:center;position:relative;flex:none}.echo .sonar .icon{width:35px;height:35px}.echo .sonar:after{content:"";position:absolute;inset:45%;border-radius:50%;border:1px solid #a9eacc;opacity:0}.echo.play .sonar:after{animation:ping 1s ease-out 2}@keyframes ping{0%{transform:scale(1);opacity:1}to{transform:scale(9);opacity:0}}.echo .echo-body{display:flex;align-items:center;gap:18px}.echo .numrow{justify-content:flex-start;margin:6px 0;font-size:22px}.echo .picks{margin:4px 0 0;gap:2px}.echo small{font-size:11px;color:#b0d0c6}
.tabs{background:#ece5dc;color:#302b2c}.file-row{display:flex;align-items:stretch;width:92%;height:114px;gap:4px}.file{border:0;border-radius:5px 11px 6px 6px;flex:1;min-width:0;padding:9px 3px;display:flex;align-items:center;justify-content:space-between;flex-direction:column;position:relative;transition:flex .45s cubic-bezier(.2,.85,.22,1)}.file[aria-pressed=true]{flex:2.4}.file .icon{width:23px;height:23px}.file .name{max-width:100%}.file .numrow{font-size:11px}.file[aria-pressed=true] .numrow{font-size:19px}.file:nth-child(1){background:#c0d2e5}.file:nth-child(2){background:#f1bd97}.file:nth-child(3){background:#b7d3c0}.file:nth-child(4){background:#d2cbdc}.file small{font-size:10px}.file:not([aria-pressed=true]) small{display:none}.tabs.play .file[aria-pressed=true]{animation:lift .45s ease}@keyframes lift{50%{transform:translateY(-5px)}}
.film.play .numrow{animation:reveal .26s ease both}
.film.play .unit:nth-child(2) .numrow{animation-delay:.22s}
.film.play .unit:nth-child(3) .numrow{animation-delay:.44s}
.film.play .unit:nth-child(4) .numrow{animation-delay:.66s}
@keyframes reveal{from{opacity:.2;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:780px){.gallery{grid-template-columns:1fr}.stage{height:170px}main{max-width:580px}.title span{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}

 6.80964 10.75 7.5C10.75 8.19036 11.3096 8.75 12 8.75C12.6904 8.75 13.25 8.19036 13.25 7.5C13.25 6.80964 12.6904 6.25 12 6.25Z"/><path d="M9.75 15.5C9.75 14.2574 10.7574 13.25 12 13.25C13.2426 13.25 14.25 14.2574 14.25 15.5C14.25 16.7426 13.2426 17.75 12 17.75C10.7574 17.75 9.75 16.7426 9.75 15.5Z"/><path fill-rule="evenodd" d="M4 10C4 6.22876 4 4.34315 5.17157 3.17157C6.34315 2 8.22876 2 12 2C15.7712 2 17.6569 2 18.8284 3.17157C20 4.34315 20 6.22876 20 10V14C20 17.7712 20 19.6569 18.8284 20.8284C17.6569 22 15.7712 22 12 22C8.22876 22 6.34315 22 5.17157 20.8284C4 19.6569 4 17.7712 4 14V10ZM9.25 7.5C9.25 5.98122 10.4812 4.75 12 4.75C13.5188 4.75 14.75 5.98122 14.75 7.5C14.75 9.01878 13.5188 10.25 12 10.25C10.4812 10.25 9.25 9.01878 9.25 7.5ZM12 11.75C9.92893 11.75 8.25 13.4289 8.25 15.5C8.25 17.5711 9.92893 19.25 12 19.25C14.0711 19.25 15.75 17.5711 15.75 15.5C15.75 13.4289 14.0711 11.75 12 11.75Z" clip-rule="evenodd"/></g></symbol></defs></svg>
<main><header><h1>无线设备 <span style="font-weight:400;color:#73776c">/ 动效选样</span></h1><div class="toolbar"><label for="scene">示例</label><select id="scene"><option>桌面设备</option><option>鼠标开始充电</option><option>鼠标仅剩 4%</option><option>耳机已断开</option></select><button id="replay">↻ 重播动效</button></div></header><div class="gallery"></div></main>
<script>
const designs=[
 ['film','扫描显影','横向扫光','一道光扫过设备，电量依次显现。'],
 ['paper','热敏纸条','逐格出纸','更新时送出一截纸带，四台设备印在同一行。'],
 ['shelf','磁吸底座','落位回弹','点选设备，图标像实体键帽一样吸回底座。'],
 ['flip','机械翻牌','数字翻转','选中一台看大读数，其余设备收在下方。'],
 ['echo','回声盘','波纹扩散','设备位于圆心，切换时由内向外发出两圈回波。'],
 ['tabs','伸缩色签','横向开合','点开一枚色签查看状态，相邻设备向两侧让位。']
];
const devices=[
 {kind:'headphones',name:'耳机',level:82},{kind:'mouse',name:'MX Master 3S',level:18},
 {kind:'keyboard',name:'MX Keys Mini',level:64,charging:true},{kind:'speaker',name:'桌面音箱',level:null}
];
function snapshot(index){
 const d={...devices[index]},scene=document.querySelector('#scene').selectedIndex;
 if(index===1&&scene===1)d.charging=true;
 if(index===1&&scene===2)d.level=4;
 if(index===0&&scene===3)d.offline=true;
 return d;
}
function status(d){
 if(d.offline)return '已断开 · 上次读数';
 if(d.level===null)return '未上报电量';
 if(d.charging)return '正在充电';
 if(d.level<=5)return '即将耗尽';
 return d.level<20?'电量偏低':'已连接';
}
function level(d){return d.level===null?'—':d.level+'%'}
function ink(d,light){
 const palette=light?['#5d6266','#266944','#992e38','#8c4c19','#344f66']:['#9ba6ac','#83ddb0','#ff8283','#ffc779','#b0dced'];
 return palette[d.offline||d.level===null?0:d.charging?1:d.level<=5?2:d.level<20?3:4];
}
function icon(d){return '<svg class="icon" aria-hidden="true"><use href="#device-'+d.kind+'"/></svg>'}
function battery(d){return '<span aria-hidden="true" class="mini '+(d.level===null?'empty':'')+'"><i></i></span>'}
function reading(d){return '<span class="numrow">'+battery(d)+(d.charging?'ϟ ':'')+(d.offline?'上次 ':'')+level(d)+'</span>'}
function style(d,light){return '--level:'+(d.level??0)+'%;--ink:'+ink(d,light)}
const gallery=document.querySelector('.gallery');
for(const [index,[kind,title,motion,description]] of designs.entries()){
 const article=document.createElement('article');
 article.innerHTML='<div class="title"><small>0'+(index+1)+'</small><h2>'+title+'</h2><span>'+motion+'</span></div><div class="stage '+kind+'"></div><p class="caption">'+description+'</p>';
 gallery.append(article);
 const stage=article.querySelector('.stage'),light=['paper','shelf','tabs'].includes(kind);
 let selected=1;
 function button(d,i,cls,body){
  return '<button type="button" class="'+cls+'" style="'+style(d,light)+'" data-index="'+i+'" aria-pressed="'+(selected===i)+'" aria-label="'+d.name+' '+level(d)+' '+status(d)+'">'+body+'</button>';
 }
 function render(){
  const all=devices.map((_,i)=>snapshot(i)),d=all[selected];
  const picks='<div class="picks">'+all.map((v,i)=>button(v,i,'pick',icon(v))).join('')+'</div>';
  const names=v=>'<span class="name">'+v.name+'</span>';
  if(kind==='flip'){
   const digits=(d.level===null?'—':String(d.level)).split('').map(n=>'<span class="digit">'+n+'</span>').join('');
   stage.innerHTML='<div class="flipbody"><div class="selected" style="'+style(d,light)+'">'+icon(d)+'<div><strong>'+d.name+'</strong><small>'+battery(d)+' '+status(d)+'</small></div></div><div class="digits">'+digits+(d.level===null?'':'<small>%</small>')+'</div></div>'+picks;
  }else if(kind==='echo'){
   stage.innerHTML='<div class="echo-body"><div class="sonar">'+icon(d)+'</div><div style="'+style(d,light)+'"><strong>'+d.name+'</strong>'+reading(d)+'<small>'+status(d)+'</small>'+picks+'</div></div>';
  }else if(kind==='tabs'){
   const html=all.map((v,i)=>button(v,i,'file',icon(v)+names(v)+reading(v)+'<small>'+status(v)+'</small>')).join('');
   if(!stage.firstChild)stage.innerHTML='<div class="file-row">'+html+'</div>';
   else {
    const temp=document.createElement('template');temp.innerHTML=html;
    [...stage.querySelectorAll('.file')].forEach((el,i)=>{const next=temp.content.children[i];for(const attr of ['style','aria-pressed','aria-label'])el.setAttribute(attr,next.getAttribute(attr));el.innerHTML=next.innerHTML});
   }
  }else{
   const units=all.map((v,i)=>button(v,i,'unit',kind==='shelf'?'<span class="cap">'+icon(v)+'</span>'+names(v)+reading(v):kind==='paper'?icon(v)+names(v)+reading(v):icon(v)+reading(v)+names(v))).join('');
   const row='<div class="row">'+units+'</div>';
   stage.innerHTML=kind==='paper'?'<div class="ticket"><div class="tickethead"><b>无线设备</b><span>'+all.filter(v=>!v.offline).length+' 台在线</span></div>'+row+'</div>':row;
  }
 }
 function animate(){stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play')}
 stage.onclick=e=>{const key=e.target.closest('button');if(!key)return;selected=Number(key.dataset.index);render();stage.querySelector('[data-index="'+selected+'"]').focus({preventScroll:true});animate()};
 document.querySelector('#scene').addEventListener('change',()=>{selected=document.querySelector('#scene').selectedIndex===3?0:1;render();animate()});
 document.querySelector('#replay').addEventListener('click',animate);
 render();animate();
}
</script></html>
