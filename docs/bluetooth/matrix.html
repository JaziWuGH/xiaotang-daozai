<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岛仔 · 无线设备电池预览</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 40% 25%,#d4dadc,#aeb8bc);color:#edf1f3;font:13px "Segoe UI","Microsoft YaHei UI",sans-serif}
main{width:min(440px,94vw)}
button,select{font:inherit}button{cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid #82d3ff;outline-offset:2px}
.bar,.panel{border:1px solid #42494e;background:#171a1d;box-shadow:0 10px 30px #2637412b}
.bar{display:flex;align-items:center;gap:9px;margin:0 auto 12px;border-radius:24px;padding:6px 13px}
.bar b,.count{font-size:11px;font-weight:450;color:#bec6ca}
.bar strong,.num{font-variant-numeric:tabular-nums}
.panel{border-radius:19px;padding:12px 13px 10px}.panel[hidden]{display:none}
.head,.detail,.controls{display:flex;align-items:center;gap:8px}
.head h1{margin:0;font-size:14px}.close{margin-left:auto;border:0;background:none;color:#a7b1b6;font-size:18px}
.rack{display:flex;justify-content:center;gap:3px;margin:9px 0;border-radius:12px;background:#101215;padding:4px}
.cell{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;border-radius:9px;padding:10px 2px 7px}
.cell[aria-pressed=true]{background:#22282c}
.battery{position:relative;isolation:isolate;display:inline-grid;place-items:center;width:min(70px,85%);height:34px;border:1px solid color-mix(in srgb,var(--tone) 48%,#424649);border-radius:8px;background:linear-gradient(#24292d,#1a1d20);margin-right:3px}
.battery::after{content:"";position:absolute;left:calc(100% + 2px);width:3px;height:11px;border-radius:0 2px 2px 0;background:var(--tone);opacity:.6}
.chamber{position:absolute;inset:2px;border-radius:5px;overflow:hidden}
.charge{height:100%;width:var(--level);display:block;border-radius:4px 2px 2px 4px;background:linear-gradient(160deg,color-mix(in srgb,var(--tone) 62%,#24272a),color-mix(in srgb,var(--tone) 30%,#1a1d20));box-shadow:inset -1px 0 var(--tone);transition:width .35s ease}
.device-icon{z-index:1;width:21px;height:21px;color:#f1f5f6;filter:drop-shadow(0 1px 1px #0c1418)}
.unknown .battery{border-style:dashed}.unknown .device-icon,.offline .battery{opacity:.65}
.charging .charge{background-image:linear-gradient(105deg,transparent 30%,#d4ffe540 48%,transparent 66%),linear-gradient(150deg,#43785d,#224333);background-size:220% 100%,100% 100%;animation:charging 2.8s ease-in-out infinite}
@keyframes charging{from{background-position:150% 0,0 0}to{background-position:-60% 0,0 0}}
@media(prefers-reduced-motion:reduce){.charging .charge{animation:none}.charge{transition:none}}
.bar .battery{width:31px;height:17px;border-radius:4px}.bar .chamber{inset:1px;border-radius:3px}.bar .device-icon{width:12px;height:12px}.bar .battery::after{height:6px;width:2px}
.num{font-size:17px;font-weight:650;color:var(--tone);margin-top:2px}.name{max-width:100%;font-size:10px;color:#c1c8cc;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.detail{min-height:18px;font-size:11px;color:#bbc5c9}.detail strong{color:#edf1f3;font-weight:550}.detail i{width:5px;height:5px;border-radius:50%}
.controls{justify-content:center;margin-top:15px;font-size:11px;color:#37464d}.controls select{border:1px solid #89979e;border-radius:6px;background:#dbe1e3;color:inherit;padding:3px}

 6.80964 10.75 7.5C10.75 8.19036 11.3096 8.75 12 8.75C12.6904 8.75 13.25 8.19036 13.25 7.5C13.25 6.80964 12.6904 6.25 12 6.25Z"/><path d="M9.75 15.5C9.75 14.2574 10.7574 13.25 12 13.25C13.2426 13.25 14.25 14.2574 14.25 15.5C14.25 16.7426 13.2426 17.75 12 17.75C10.7574 17.75 9.75 16.7426 9.75 15.5Z"/><path fill-rule="evenodd" d="M4 10C4 6.22876 4 4.34315 5.17157 3.17157C6.34315 2 8.22876 2 12 2C15.7712 2 17.6569 2 18.8284 3.17157C20 4.34315 20 6.22876 20 10V14C20 17.7712 20 19.6569 18.8284 20.8284C17.6569 22 15.7712 22 12 22C8.22876 22 6.34315 22 5.17157 20.8284C4 19.6569 4 17.7712 4 14V10ZM9.25 7.5C9.25 5.98122 10.4812 4.75 12 4.75C13.5188 4.75 14.75 5.98122 14.75 7.5C14.75 9.01878 13.5188 10.25 12 10.25C10.4812 10.25 9.25 9.01878 9.25 7.5ZM12 11.75C9.92893 11.75 8.25 13.4289 8.25 15.5C8.25 17.5711 9.92893 19.25 12 19.25C14.0711 19.25 15.75 17.5711 15.75 15.5C15.75 13.4289 14.0711 11.75 12 11.75Z" clip-rule="evenodd"/></g></symbol></defs></svg>
<main><button class="bar" aria-controls="panel" aria-expanded="true"><span class="battery" aria-hidden="true"><span class="chamber"><i class="charge"></i></span><svg class="device-icon" aria-hidden="true"><use></use></svg></span><b></b><strong></strong></button>
<section class="panel" id="panel"><header class="head"><h1>无线设备</h1><span class="count"></span><button class="close" aria-label="收起无线设备">⌃</button></header><div class="rack" aria-label="选择设备"></div><div class="detail"><i></i><strong></strong><span></span></div></section>
<div class="controls"><label for="mode">示例场景</label><select id="mode"><option>桌面设备</option><option>鼠标开始充电</option><option>鼠标仅剩 4%</option><option>耳机已断开</option></select></div></main>
<script>
const $=s=>document.querySelector(s);
const devices=[{kind:'headphones',name:'耳机',level:82},{kind:'mouse',name:'MX Master 3S',level:18},{kind:'keyboard',name:'MX Keys Mini',level:64,charging:true},{kind:'speaker',name:'桌面音箱',level:null}];
let selected=1,hover=null;

function sample(i){
 const d={...devices[i]}, mode=$('#mode').selectedIndex;
 if(i===1&&mode===1)d.charging=true;
 if(i===1&&mode===2)d.level=4;
 if(i===0&&mode===3)d.offline=true;
 return d;
}
function tone(d){return d.offline||d.level===null?'#94a1aa':d.charging?'#69dfaa':d.level<=5?'#ff7277':d.level<20?'#f8b366':'#83c9ff'}
function status(d){if(d.offline)return '已断开 · 上次 '+d.level+'%';if(d.level===null)return '未上报电量';if(d.charging)return '正在充电';return d.level<=5?'即将耗尽':d.level<20?'电量偏低':'已连接'}
function display(d){return d.level===null?'—':(d.offline?'上次 ':'')+d.level+'%'}
function setBattery(element,device){
 element.style.setProperty('--level',(device.level??0)+'%');
 element.style.setProperty('--tone',tone(device));
 element.classList.toggle('charging',Boolean(device.charging&&!device.offline));
 element.classList.toggle('offline',Boolean(device.offline));
 element.classList.toggle('unknown',device.level===null);
}
const cells=devices.map((d,i)=>{
 const b=document.createElement('button');b.className='cell';b.innerHTML='<span class="battery" aria-hidden="true"><span class="chamber"><i class="charge"></i></span><svg class="device-icon" aria-hidden="true"><use></use></svg></span><span class="num"></span><span class="name"></span>';b.querySelector('use').setAttribute('href','#device-'+d.kind);$('.rack').append(b);
 b.onclick=()=>{selected=i;hover=null;render()};b.onpointerenter=()=>{hover=i;details()};b.onpointerleave=()=>{hover=null;details()};b.onfocus=()=>{hover=i;details()};b.onblur=()=>{hover=null;details()};return b
});
function details(){
 const i=hover??selected,d=sample(i);$('.detail strong').textContent=d.name;$('.detail span').textContent=status(d);$('.detail i').style.background=tone(d);
 cells.forEach((b,j)=>{b.style.opacity=hover===null||hover===j?'1':'.65'})
}
function render(){

 cells.forEach((b,i)=>{const d=sample(i);setBattery(b,d);b.querySelector('.num').textContent=(d.charging?'ϟ ':'')+display(d);b.querySelector('.name').textContent=d.name;b.setAttribute('aria-pressed',i===selected);b.setAttribute('aria-label',[d.name,display(d),status(d)].join('，'))});
 const d=sample(selected);setBattery($('.bar'),d);$('.bar use').setAttribute('href','#device-'+d.kind);$('.bar b').textContent=d.name;$('.bar strong').textContent=(d.charging?'ϟ ':'')+display(d);$('.bar strong').style.color=tone(d);$('.count').textContent=devices.filter((_,i)=>!sample(i).offline).length+' 台已连接';details()
}
function toggle(){const p=$('#panel');p.hidden=!p.hidden;$('.bar').setAttribute('aria-expanded',!p.hidden);hover=null;render()}
$('.bar').onclick=toggle;$('.close').onclick=()=>{toggle();$('.bar').focus()};$('#mode').onchange=render;render();
</script></html>
